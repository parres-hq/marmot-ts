[package]
name = "lifetime-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cgka-engine = { path = "../../../refs/mdk/crates/cgka-engine" }
cgka-traits = { path = "../../../refs/mdk/crates/traits" }
ed25519-dalek = "2"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["schnorr"] }
openmls = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
openmls_basic_credential = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
openmls_memory_storage = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
openmls_rust_crypto = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
openmls_traits = { git = "https://github.com/erskingardner/openmls.git", rev = "59e7d3b27a7e95237879dd5478de1fd90eff7ada" }
serde_json = "1"
sha2 = "0.10"
tls_codec = { version = "0.5", features = ["derive", "std"] }
